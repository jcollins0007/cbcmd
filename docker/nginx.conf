server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;
    location /api/ { proxy_pass http://backend:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_connect_timeout 30s; proxy_read_timeout 120s; }
    location / { try_files $uri $uri/ /index.html; }
    gzip on; gzip_types text/plain application/json application/javascript text/css;
}
